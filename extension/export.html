<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>旁听 · 导出 PDF</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script defer src="export.js"></script>
    <link rel="stylesheet" href="export.css" />
  </head>
  <body>
    <div id="export-controls">
      <span>旁听学习笔记</span>
      <div class="export-actions">
        <button id="print-button">打印</button
        ><button id="pdf-button" class="primary">下载 PDF</button>
      </div>
    </div>
    <p id="save-hint" hidden>
      浏览器不允许网页直接保存 PDF：请在刚打开的打印窗口里，把「目标打印机」改成
      <b>另存为 PDF</b>，再点保存。
    </p>
    <main id="document"><p>正在加载学习笔记…</p></main>
  </body>
</html>
