<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="dark" />
    <title>旁听 · 独立学习空间</title>
    <link rel="icon" href="icons/32.png" />
    <link rel="stylesheet" href="learn.css" />
    <script defer src="learn.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a
        id="source-link"
        class="back-button"
        target="_blank"
        rel="noopener"
        title="返回 YouTube"
        aria-label="返回 YouTube"
        >‹</a
      >
      <div class="lesson-heading">
        <h1 id="lesson-title">正在打开视频…</h1>
        <p id="lesson-author">YouTube</p>
      </div>
      <nav class="top-actions" aria-label="学习设置">
        <img class="brand" src="icons/32.png" width="28" height="28" alt="旁听 Sidenote" />
        <button
          id="focus-toggle"
          class="icon-btn"
          title="放大画面：暂时收起右侧面板与字幕条"
          aria-label="放大画面"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button id="guide" class="icon-btn" title="功能引导" aria-label="功能引导">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7" />
            <path
              d="M9.2 9.3a2.8 2.8 0 1 1 3.7 2.7c-.7.3-1 .8-1 1.5v.4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
            <circle cx="12" cy="17" r="1.1" fill="currentColor" />
          </svg></button
        ><button id="settings" class="icon-btn" title="AI 设置" aria-label="AI 设置">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7" />
            <path
              d="M12 2.8v2.3M12 18.9v2.3M21.2 12h-2.3M5.1 12H2.8M18.5 5.5l-1.6 1.6M7.1 16.9l-1.6 1.6M18.5 18.5l-1.6-1.6M7.1 7.1 5.5 5.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </nav>
    </header>
    <main class="workspace">
      <section class="theater" aria-label="视频与双语字幕">
        <div class="screen">
          <div class="video-stage">
            <div class="player-wrap">
              <iframe
                id="player"
                title="YouTube 视频播放器"
                allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                referrerpolicy="strict-origin-when-cross-origin"
              ></iframe>
            </div>
          </div>
          <div id="player-error" class="player-error" role="status" hidden></div>
          <div class="subtitles" id="subtitles" aria-live="off">
            <p id="original">字幕会随播放同步显示</p>
            <p id="translated"></p>
            <button
              id="explain-caption"
              class="caption-explain"
              title="让 AI 解释这一句"
              aria-label="让 AI 解释这一句"
            >
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path
                  d="M8 2.4q1.5 4.1 5.6 5.6-4.1 1.5-5.6 5.6-1.5-4.1-5.6-5.6Q6.5 6.5 8 2.4z"
                  fill="currentColor"
                />
                <path
                  d="M15 11.4q.8 2.2 3 3-2.2.8-3 3-.8-2.2-3-3 2.2-.8 3-3z"
                  fill="currentColor"
                  opacity="0.75"
                />
              </svg>
            </button>
          </div>
          <div class="playback">
            <label for="timeline" class="sr-only">播放进度</label
            ><input id="timeline" type="range" min="0" max="1" value="0" step="0.1" />
            <div class="playback-row">
              <div class="playback-main">
                <button id="play" aria-label="播放或暂停">▶</button
                ><button id="backward" title="后退 10 秒" aria-label="后退 10 秒">
                  ↶<small>10</small></button
                ><button id="forward" title="前进 10 秒" aria-label="前进 10 秒">
                  ↷<small>10</small></button
                ><time id="clock">0:00 / 0:00</time>
              </div>
              <div class="playback-options">
                <div class="menu-wrap">
                  <div id="speed-menu" class="player-menu" role="group" aria-label="播放速度" hidden>
                    <div class="player-menu-head">
                      <span>播放速度</span><b id="speed-now">1×</b>
                    </div>
                    <div class="player-menu-grid" id="speed-options"></div>
                  </div>
                  <button id="speed-toggle" aria-label="播放速度" aria-expanded="false" title="播放速度">
                    <svg viewBox="0 0 20 20" aria-hidden="true" class="player-icon">
                      <path
                        d="M3.6 15.2a8 8 0 1 1 12.8 0"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                      />
                      <path
                        d="M10 11.2 13.6 7"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                      />
                      <circle cx="10" cy="11.6" r="1.5" fill="currentColor" />
                    </svg>
                  </button>
                </div>
                <div class="menu-wrap">
                  <div id="volume-menu" class="player-menu" role="group" aria-label="音量" hidden>
                    <div class="player-menu-head"><span>音量</span><b id="volume-now">100</b></div>
                    <input
                      id="volume"
                      class="player-slider"
                      type="range"
                      min="0"
                      max="100"
                      step="1"
                      value="100"
                      aria-label="音量"
                    />
                  </div>
                  <button id="volume-toggle" aria-label="音量" aria-expanded="false" title="音量">
                    <svg viewBox="0 0 20 20" aria-hidden="true" class="player-icon">
                      <path
                        d="M9.4 3.6 5.6 6.8H3a.9.9 0 0 0-.9.9v4.6a.9.9 0 0 0 .9.9h2.6l3.8 3.2z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linejoin="round"
                      />
                      <path
                        id="volume-waves"
                        d="M12.8 7.2a4 4 0 0 1 0 5.6M15.2 5a7 7 0 0 1 0 10"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                      />
                    </svg>
                  </button>
                </div>
                <div class="menu-wrap">
                  <div id="captions-menu" class="player-menu" role="group" aria-label="字幕显示" hidden>
                    <div class="player-menu-head"><span>字幕</span></div>
                    <div class="player-menu-grid" id="captions-options"></div>
                  </div>
                  <button
                    id="captions-toggle"
                    aria-label="字幕显示方式"
                    aria-expanded="false"
                    aria-pressed="true"
                    title="字幕显示方式"
                  >
                    <svg viewBox="0 0 22 20" aria-hidden="true" class="player-icon">
                      <rect
                        x="1.6"
                        y="3.4"
                        width="15.6"
                        height="13.2"
                        rx="3.4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                      />
                      <path
                        d="M7.6 8.6a2.4 2.4 0 1 0 0 2.8M13 8.6a2.4 2.4 0 1 0 0 2.8"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                      />
                      <path
                        class="cc-spark"
                        d="M18.6 1.6q.7 2.5 3 3.2-2.3.7-3 3.2-.7-2.5-3-3.2 2.3-.7 3-3.2z"
                        fill="currentColor"
                      />
                    </svg>
                  </button>
                </div>
                <button id="fullscreen" aria-label="全屏学习" title="全屏学习">⛶</button>
              </div>
            </div>
          </div>
        </div>
      </section>
      <aside class="study" aria-label="字幕、章节与 AI 学习工具">
        <iframe id="study-panel" title="旁听 AI 学习面板"></iframe>
      </aside>
    </main>
  </body>
</html>
