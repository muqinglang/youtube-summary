# Single instance on purpose. Job state and the login throttle live in this process, so a second
# machine would answer job polls it knows nothing about. Raising this requires moving both into
# Postgres or Redis first — see server/README.md.
app = "sidenote"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Zero, not one. `max_machines_running` governs autostart and does not stop a deploy from
  # creating a second machine for high availability — which it did, and two machines answer job
  # polls they know nothing about. flyctl only skips the HA machine when this is 0.
  # Suspend keeps the VM's memory, and a cold start costs about a second against AI calls that
  # take minutes, so nothing here depends on a machine staying warm.
  min_machines_running = 0
  max_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
